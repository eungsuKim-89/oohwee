backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "events"
    label: "행사 공고"
    files:
      - name: "event-list"
        label: "행사 목록"
        file: "data/events.json"
        fields:
          - label: "목록"
            name: "items"
            widget: "list"
            fields:
              - label: "행사명"
                name: "title"
                widget: "string"
              - label: "세부카테고리"
                name: "category"
                widget: "string"
                hint: "예: 문정, 위례, 여의도 등 자유롭게 입력 — 새 이름을 적으면 새 카테고리로 자동 생성됩니다"
                required: false
              - label: "날짜"
                name: "date"
                widget: "string"
              - label: "장소"
                name: "place"
                widget: "string"
              - label: "구좌비"
                name: "price"
                widget: "string"
              - label: "모집 상태"
                name: "status"
                widget: "select"
                options: ["모집중", "모집예정", "마감"]

  - name: "reference"
    label: "레퍼런스 사진"
    files:
      - name: "reference-list"
        label: "레퍼런스 목록"
        file: "data/reference.json"
        fields:
          - label: "목록"
            name: "items"
            widget: "list"
            fields:
              - label: "사진들(여러장 선택 가능)"
                name: "images"
                widget: "list"
                field:
                  label: "사진"
                  name: "image"
                  widget: "image"
              - label: "카테고리"
                name: "category"
                widget: "select"
                options: ["프리마켓", "공연", "기획"]
              - label: "설명"
                name: "description"
                widget: "text"
